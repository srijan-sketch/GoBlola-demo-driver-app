<meta charset="UTF-8">
<title>GoBhola Flow Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ THEME TOKENS ============ */
:root{
  --page-bg:#EEF1F5;
  --panel-bg:#FFFFFF;
  --panel-border:#E3E7EE;
  --panel-fg:#171A21;
  --panel-muted:#6B7280;
  --panel-muted-2:#94A0B2;
  --accent:#0E9F6E;
  --accent-dark:#0B8059;
  --accent-fg:#FFFFFF;
  --accent-soft:#E6F7EF;
  --danger:#E5484D;
  --danger-soft:#FCE9E9;
  --warning:#B7791F;
  --warning-soft:#FCF1DA;
  --stage-bg:#E4E8EE;
  --chip-bg:#F3F5F8;
  --chip-fg:#3A4150;
  --divider:#E9ECF1;
  --shadow: 0 1px 2px rgba(20,24,32,.04), 0 8px 24px rgba(20,24,32,.06);
  --focus: 0 0 0 3px rgba(14,159,110,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page-bg:#0D0F13;
    --panel-bg:#161920;
    --panel-border:#272C36;
    --panel-fg:#EEF1F6;
    --panel-muted:#9AA3B4;
    --panel-muted-2:#6E7787;
    --accent:#17C384;
    --accent-dark:#0FA06D;
    --accent-fg:#04120C;
    --accent-soft:#123226;
    --danger:#F0666B;
    --danger-soft:#3A1B1E;
    --warning:#E0AC52;
    --warning-soft:#332A16;
    --stage-bg:#08090C;
    --chip-bg:#1D212A;
    --chip-fg:#C4CBD6;
    --divider:#272C36;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --page-bg:#0D0F13;
  --panel-bg:#161920;
  --panel-border:#272C36;
  --panel-fg:#EEF1F6;
  --panel-muted:#9AA3B4;
  --panel-muted-2:#6E7787;
  --accent:#17C384;
  --accent-dark:#0FA06D;
  --accent-fg:#04120C;
  --accent-soft:#123226;
  --danger:#F0666B;
  --danger-soft:#3A1B1E;
  --warning:#E0AC52;
  --warning-soft:#332A16;
  --stage-bg:#08090C;
  --chip-bg:#1D212A;
  --chip-fg:#C4CBD6;
  --divider:#272C36;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--page-bg);
  color:var(--panel-fg);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.font-display{font-family:'Manrope',Inter,sans-serif;}
::selection{background:rgba(14,159,110,.25);}

/* ============ APP SHELL LAYOUT ============ */
.deck{
  display:flex;
  min-height:100%;
  align-items:stretch;
}
.control-panel{
  width:352px;
  flex:0 0 352px;
  background:var(--panel-bg);
  border-right:1px solid var(--panel-border);
  padding:22px 18px 28px;
  padding-block:22px 28px;
  overflow-y:auto;
  height:100vh;
  position:sticky;
  top:0;
}
.stage{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:18px;
  padding:36px 24px 48px;
  background:
    radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 60%),
    var(--stage-bg);
  min-height:100vh;
}
@media (max-width: 880px){
  .deck{flex-direction:column;}
  .control-panel{
    width:auto;flex:none;position:relative;height:auto;
    border-right:none;border-bottom:1px solid var(--panel-border);
    max-height:56vh;
  }
}

/* ---- Brand lockup in panel ---- */
.brand{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;
}
.brand-lockup{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(155deg, var(--accent), var(--accent-dark));
  display:flex;align-items:center;justify-content:center;
  box-shadow: var(--shadow);
  flex:0 0 auto;
}
.brand-title{font-family:'Manrope';font-weight:800;font-size:16.5px;letter-spacing:-.01em;}
.brand-sub{font-size:11.5px;color:var(--panel-muted);margin-top:-2px;}

.panel-section{margin-bottom:20px;}
.panel-section + .panel-section{padding-top:18px;border-top:1px solid var(--divider);}
.panel-eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--panel-muted-2);margin:0 0 10px;display:flex;align-items:center;gap:6px;
}
.panel-eyebrow .cnt{
  background:var(--chip-bg);color:var(--chip-fg);border-radius:20px;font-size:10px;
  padding:1px 7px;font-weight:700;letter-spacing:0;
}

/* master toggle */
.seg{
  display:flex;background:var(--chip-bg);border-radius:12px;padding:4px;gap:4px;
}
.seg button{
  flex:1;border:0;background:transparent;padding:9px 8px;border-radius:9px;
  font-family:inherit;font-weight:700;font-size:12.5px;color:var(--panel-muted);cursor:pointer;
  transition:all .15s ease;
}
.seg button.active{background:var(--panel-bg);color:var(--panel-fg);box-shadow:var(--shadow);}
.seg button.active.on{color:var(--accent);}

.state-readout{
  margin-top:12px;font-size:11.5px;color:var(--panel-muted);
  background:var(--chip-bg);border-radius:10px;padding:9px 11px;line-height:1.5;
}
.state-readout b{color:var(--panel-fg);font-weight:700;}

.btn-reset-header{
  flex:0 0 auto;border:1px solid var(--panel-border);background:transparent;
  color:var(--panel-muted);font-family:inherit;font-weight:600;font-size:11.5px;
  padding:7px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:5px;
}
.btn-reset-header:hover{border-color:var(--danger);color:var(--danger);}

/* nav rows */
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.nav-grid.c1{grid-template-columns:1fr;}
.nav-btn{
  text-align:left;border:1px solid var(--panel-border);background:var(--panel-bg);
  border-radius:10px;padding:9px 10px;cursor:pointer;font-family:inherit;
  font-size:12.5px;font-weight:600;color:var(--panel-fg);
  display:flex;align-items:center;gap:7px;
  transition:border-color .12s ease, background .12s ease;
}
.nav-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--panel-muted-2);flex:0 0 auto;}
.nav-btn:hover{border-color:var(--accent);}
.nav-btn.active{
  background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark);
}
.nav-btn.active .dot{background:var(--accent);}
.nav-btn small{display:block;font-weight:500;color:var(--panel-muted);font-size:10.5px;margin-top:1px;}
.nav-btn.warn.active{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.nav-btn.warn.active .dot{background:var(--danger);}
.nav-btn:disabled{opacity:.4;cursor:not-allowed;}
.nav-btn:disabled:hover{border-color:var(--panel-border);}

.panel-hint{font-size:11px;color:var(--panel-muted-2);margin-top:8px;line-height:1.5;}

/* ============ PHONE FRAME ============ */
.stage-topbar{
  color:var(--panel-fg);opacity:.65;font-size:12px;font-weight:600;
  letter-spacing:.02em;display:flex;gap:8px;align-items:center;
}
.stage-topbar .sep{opacity:.4;}
.phone{
  width:390px;height:844px;border-radius:52px;
  background:#0b0c10;
  padding:14px;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
  flex:0 0 auto;
}
.phone-screen{
  position:relative;
  width:100%;height:100%;border-radius:40px;overflow:hidden;
  background:#F6F8FA;
  color:#171A21;
  font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;
}
.phone-notch{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  width:120px;height:26px;background:#0b0c10;border-radius:20px;z-index:50;
}

/* status bar */
.statusbar{
  height:47px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:15px;font-weight:700;color:#111318;background:transparent;
}
.statusbar .icons{display:flex;gap:5px;align-items:center;}

.screen-scroll{flex:1 1 auto;overflow-y:auto;position:relative;}
.screen-scroll::-webkit-scrollbar{width:0;}
.screen-pad{padding:4px 18px 20px;}

/* app header */
.app-header{
  display:flex;align-items:center;justify-content:space-between;padding:6px 18px 14px;
}
.go-logo{display:flex;align-items:center;gap:1px;font-family:'Manrope';font-weight:800;font-size:23px;color:#111318;}
.go-logo .g{color:var(--accent);}
.icon-btn{
  width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid #ECEFF3;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(20,24,32,.05);
  cursor:pointer;position:relative;flex:0 0 auto;
}
.icon-btn .badge{
  position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;
  background:var(--danger);border:2px solid #fff;
}
.back-header{
  display:flex;align-items:center;padding:10px 12px 10px;position:relative;
}
.back-header .back-btn{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:transparent;border:0;
}
.back-header h2{
  position:absolute;left:0;right:0;text-align:center;font-size:16.5px;font-weight:700;
  font-family:'Manrope';pointer-events:none;margin:0;
}

/* bottom tabs */
.tabbar{
  flex:0 0 auto;background:#fff;border-top:1px solid #EEF0F3;
  padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:space-around;
}
.tab-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  padding:6px 18px;border-radius:16px;color:#9CA3AF;transition:all .15s;
}
.tab-item.active{background:var(--accent-soft);color:var(--accent-dark);}
.tab-item span{font-size:11.5px;font-weight:700;}

/* generic content atoms */
h1,.h1{font-family:'Manrope';font-weight:800;font-size:21px;margin:2px 0 4px;letter-spacing:-.01em;line-height:1.25;}
.muted{color:#6B7280;}
.small{font-size:12.5px;}
.tiny{font-size:11px;}
.card{
  background:#fff;border:1px solid #ECEFF3;border-radius:16px;padding:16px;
  box-shadow:0 1px 2px rgba(20,24,32,.03);
}
.card + .card{margin-top:12px;}
.row{display:flex;align-items:center;}
.row.between{justify-content:space-between;}
.row.gap8{gap:8px;}
.row.gap10{gap:10px;}
.row.gap12{gap:12px;}
.col{display:flex;flex-direction:column;}
.stack{display:flex;flex-direction:column;gap:10px;}
.pill{
  display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 10px;
  font-size:11px;font-weight:700;
}
.pill.green{background:var(--accent-soft);color:var(--accent-dark);}
.pill.amber{background:var(--warning-soft);color:var(--warning);}
.pill.red{background:var(--danger-soft);color:var(--danger);}
.pill.dark{background:#171A21;color:#fff;}

.btn{
  width:100%;border:0;border-radius:14px;padding:15px 16px;font-family:'Inter';
  font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s ease, filter .12s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.05);}
.btn-primary:disabled{background:#D8DCE2;color:#9AA1AC;cursor:not-allowed;}
.btn-outline{background:#fff;border:1.5px solid #E4E7EC;color:#171A21;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-dark{background:#171A21;color:#fff;}
.btn-sm{padding:10px 14px;font-size:13px;border-radius:11px;}
.btn-ghost{background:#F3F5F8;color:#171A21;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:6px;}
.field input, .field textarea{
  width:100%;border:1.3px solid #E4E7EC;border-radius:12px;padding:13px 14px;font-family:inherit;
  font-size:14.5px;color:#171A21;background:#fff;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus);}
.field .help{font-size:11px;color:#9CA3AF;margin-top:5px;}
.field.check{display:flex;align-items:flex-start;gap:9px;}
.field.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;flex:0 0 auto;}
.chip-toggle{
  border:1.3px solid transparent;border-radius:20px;padding:9px 16px;font-family:'Inter';
  font-weight:700;font-size:13px;cursor:pointer;background:#F3F5F8;color:#6B7280;
  transition:background .12s ease,color .12s ease;
}
.chip-toggle.selected{background:#171A21;color:#fff;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;}
.toggle-row .lbl{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.toggle-row .lbl p{margin:0;font-size:13.5px;font-weight:600;color:#374151;}

.otp-row{display:flex;gap:8px;margin:18px 0 8px;}
.otp-box{
  width:44px;height:52px;border:1.5px solid #E4E7EC;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
}
.otp-box.filled{border-color:#D7DBE1;background:#FAFBFC;}
.otp-box.cursor{border-color:var(--accent);box-shadow:var(--focus);}

.stepper{display:flex;align-items:center;gap:4px;margin-bottom:18px;}
.step-dot{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#EAF6F0;color:#9BBFAF;flex:0 0 auto;
}
.step-dot.done{background:var(--accent-soft);color:var(--accent);}
.step-dot.now{background:var(--accent);color:#fff;}
.step-line{flex:1 1 auto;height:2px;background:#E3F2EA;}
.step-line.done{background:var(--accent);}

.list-item{
  display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #F0F1F4;cursor:pointer;
}
.list-item:last-child{border-bottom:0;}
.list-ic{
  width:38px;height:38px;border-radius:11px;background:#F3F5F8;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.slide-confirm{
  position:relative;height:54px;background:#EEF0F3;border-radius:16px;overflow:hidden;
  display:flex;align-items:center;cursor:pointer;user-select:none;
}
.slide-confirm .fill{position:absolute;inset:0;width:0%;background:var(--accent-soft);transition:width .2s;}
.slide-confirm.danger .fill{background:var(--danger-soft);}
.slide-confirm .knob{
  position:relative;z-index:2;width:44px;height:44px;margin-left:5px;border-radius:12px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;transition:margin-left .2s;flex:0 0 auto;
}
.slide-confirm.danger .knob{background:var(--danger);}
.slide-confirm .label{position:relative;z-index:1;flex:1;text-align:center;font-weight:700;color:#171A21;font-size:13.5px;margin-right:44px;}

.info-banner{
  border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;display:flex;gap:10px;
}
.info-banner.blue{background:#EAF1FE;color:#33507C;}
.info-banner.green{background:var(--accent-soft);color:var(--accent-dark);}
.info-banner.amber{background:var(--warning-soft);color:#8A5A10;}

.divider{height:1px;background:#EEF0F3;margin:14px 0;}

.route-grid{display:grid;grid-template-columns:36px 1fr;column-gap:12px;}
.route-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.route-line-wrap{display:flex;justify-content:center;}
.route-line{width:2px;min-height:26px;height:100%;background-image:linear-gradient(to bottom,#D7DBE1 50%, transparent 0%);background-size:2px 8px;background-repeat:repeat-y;}
.route-mid{margin:0;padding:9px 0;font-weight:700;color:#374151;display:flex;align-items:center;gap:6px;font-size:12.5px;}

/* modal / sheet */
.overlay{
  position:absolute;inset:0;background:rgba(10,12,16,.42);z-index:80;
  display:flex;align-items:flex-end;
}
.overlay.center{align-items:center;justify-content:center;padding:0 20px;}
.sheet{
  background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));
  animation:sheetup .22s ease;max-height:88%;overflow-y:auto;
}
.sheet.pop{border-radius:22px;animation:popin .16s ease;}
@keyframes sheetup{from{transform:translateY(24px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
@keyframes popin{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.sheet-grabber{width:38px;height:4px;background:#E4E7EC;border-radius:3px;margin:0 auto 16px;}
.sheet-close{
  position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:#F3F5F8;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.toast{
  position:absolute;left:18px;right:18px;top:100px;background:#171A21;color:#fff;font-size:12.5px;font-weight:600;
  padding:11px 14px;border-radius:12px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25);
  animation:toastin .25s ease;
}
@keyframes toastin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(155deg,#5B7FEE,#7C5CEE);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;flex:0 0 auto;}

.hero-illustration{
  border-radius:20px;background:linear-gradient(180deg,#EAF6EF,#F6FBF8);
  display:flex;align-items:center;justify-content:center;padding:26px 0;margin-bottom:8px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>

<div class="deck">
  <aside class="control-panel" id="panel"></aside>
  <main class="stage">
    <div class="stage-topbar" id="stageTopbar"></div>
    <div class="phone">
      <div class="phone-screen" id="phoneScreen">
        <div class="phone-notch"></div>
      </div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   GoBhola Driver App — Interactive Flow Prototype
   Single-file state machine driving a simulated phone screen,
   with a left control panel for jumping directly to any state.
   ============================================================ */

/* Icons are Phosphor Icons (regular weight), inlined as raw SVG paths so the
   page has no external font/script dependency. Source: @phosphor-icons/core. */
const ICONS = {
  bell: `<svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z"/></svg>`,

function TripCard(trip, mode){
  // mode: 'available' | 'upcoming'
  const gatedByCert = !S.certified;
  const hasActiveTrip = S.tripPhase !== 'none';
  const isThisAccepted = hasActiveTrip && trip.id === S.activeTripId;
  // Once a trip is accepted, every OTHER trip is blocked for the driver's 14-hour driving window.
  const windowLocked = !gatedByCert && hasActiveTrip && !isThisAccepted;
  return `
  <div class="card" style="padding:0;overflow:hidden;">
    <div style="background:var(--accent-soft);padding:14px 16px;">
      <div class="row between">
        <div><p class="tiny muted" style="margin:0;">You will earn</p><p style="font-weight:800;font-size:22px;margin:2px 0 0;">${fmtINR(trip.earn)}</p></div>
        <div style="text-align:right;">
          <div class="row gap8" style="justify-content:flex-end;color:#374151;font-weight:600;font-size:12.5px;">${ICONS.route}${trip.km}KM</div>
          <div class="row gap8" style="justify-content:flex-end;color:#374151;font-weight:600;font-size:12.5px;margin-top:3px;">${ICONS.clock}${trip.eta}</div>
        </div>
      </div>
    </div>
    <div style="padding:14px 16px;">
      <div class="row between small" style="margin-bottom:10px;">
        <div class="row gap8 muted">${ICONS.calendar}Reporting by<br></div>
        <div class="row gap8" style="color:#B7791F;">${ICONS.clock}${trip.handoverLabel}</div>
      </div>
      <div class="row between small" style="margin-top:-8px;margin-bottom:12px;font-weight:700;">
        <span>${trip.reportingBy}</span><span>${trip.handoverBy}</span>
      </div>
      <div class="row gap10" style="margin-bottom:8px;align-items:flex-start;">
        <div style="color:var(--accent);margin-top:1px;">${ICONS[trip.pickup.icon]}</div>
        <div><p style="margin:0;font-weight:600;font-size:13px;">${trip.pickup.name}</p><p class="tiny muted" style="margin:1px 0 0;">${trip.pickup.addr}</p></div>
      </div>
      <div class="row gap10" style="align-items:flex-start;margin-bottom:14px;">
        <div style="color:${dropIconColor(trip.drop)};margin-top:1px;">${ICONS[trip.drop.icon]}</div>
        <div><p style="margin:0;font-weight:600;font-size:13px;">${trip.drop.name}</p><p class="tiny muted" style="margin:1px 0 0;">${trip.drop.addr}</p></div>
      </div>
      ${ mode==='available' ? (
        gatedByCert
        ? `<button class="btn btn-ghost" style="color:#9CA3AF;" onclick="openModal('certRequired')">${ICONS.lock} Accept Trip</button>`
        : windowLocked
          ? `<button class="btn btn-ghost" disabled style="color:#C2C8D2;">Accept Trip</button>`
        : isThisAccepted
          ? `<div class="row gap10"><button class="btn btn-outline btn-sm" style="flex:1;" onclick="openDetail('${trip.id}')">View Details</button><button class="btn btn-primary btn-sm" style="flex:1;background:var(--accent-soft);color:var(--accent-dark);" disabled>Trip Accepted</button></div>`
          : `<div class="row gap10"><button class="btn btn-outline btn-sm" style="flex:1;" onclick="openDetail('${trip.id}')">View Details</button><button class="btn btn-primary btn-sm" style="flex:1;" onclick="acceptTrip('${trip.id}')">Accept Trip</button></div>`
      ) : `<button class="btn btn-outline" onclick="openDetail('${trip.id}')">View Details</button>`}
    </div>
    ${ mode==='available' && windowLocked ? `
      <div style="position:absolute;inset:0;background:rgba(255,255,255,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:16px;">

        <p class="tiny muted" style="margin:0;max-width:220px;">${WINDOW_LOCK_MSG}</p>

}

function screenTripsActive(){
  const leg = LEGS[S.legIndex];
  const trip = AVAILABLE_TRIPS.find(t=>t.id===S.activeTripId);
  const phase = S.tripPhase;

  if(phase==='checklistStart' || phase==='legStartChecklist') return ChecklistScreen(true);
  if(phase==='checklistEnd' || phase==='legEndChecklist') return ChecklistScreen(false);

  if(phase==='preActive'){
    const canCancel = !S.cancelWindowPassed;
    return `
    ${AppHeader()}
    <div class="screen-scroll"><div class="screen-pad" style="padding-top:2px;">
      ${TripsTopTabs()}
      <div class="card">
        <div class="row between" style="margin-bottom:12px;">
          <div><p class="tiny muted" style="margin:0;">Trip ID</p><p style="font-weight:800;margin:1px 0 0;font-size:13px;">${S.activeTripId}</p></div>
          <span class="pill" style="background:var(--chip-bg);color:var(--chip-fg);">Not yet started</span>
        </div>
        <div class="divider" style="margin:0 0 12px;"></div>
        <div class="row gap10" style="align-items:flex-start;margin-bottom:12px;">
          <div style="color:var(--accent);margin-top:1px;">${ICONS[trip.pickup.icon]}</div>
          <div><p style="margin:0;font-weight:600;font-size:13px;">${trip.pickup.name}</p><p class="tiny muted" style="margin:1px 0;">${trip.pickup.addr}</p></div>
        </div>
        <div class="row gap10" style="align-items:flex-start;margin-bottom:16px;">
          <div style="color:${dropIconColor(trip.drop)};margin-top:1px;">${ICONS[trip.drop.icon]}</div>
          <div><p style="margin:0;font-weight:600;font-size:13px;">${trip.drop.name}</p><p class="tiny muted" style="margin:1px 0;">${trip.drop.addr}</p></div>
        </div>
        ${canCancel ? `
          <div class="row gap10"><button class="btn btn-outline" style="flex:1;" onclick="openModal('cancelTrip')">Cancel</button><button class="btn btn-primary" style="flex:1;" disabled>Verify &amp; Start</button></div>
          <div class="info-banner blue" style="margin-top:12px;">${ICONS.shield} The Start Trip button unlocks at 11:30 AM once the cancellation window ends.</div>
        ` : `<button class="btn btn-primary" onclick="startVerifyFlow()">Verify &amp; Start</button>`}
      </div>
    </div></div>
    ${TabBar()}`;
  }

  if(phase==='startCelebrate'){
    return `
    <div class="screen-scroll"><div class="screen-pad" style="padding-top:90px;text-align:center;position:relative;">
      <svg width="220" height="160" viewBox="0 0 220 160" style="position:absolute;top:20px;left:50%;transform:translateX(-50%);pointer-events:none;">
        ${['#0E9F6E','#F0A727','#3B82F6','#E5484D','#7C5CEE'].map((c,i)=>`<rect x="${20+i*38+ (i%2?8:0)}" y="${10+ (i%3)*20}" width="7" height="12" fill="${c}" transform="rotate(${(i*37)%360} ${23+i*38} ${16+(i%3)*20})"/>`).join('')}
      </svg>
      <div style="width:88px;height:88px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;position:relative;">${ICONS.check}</div>
      <h1>Trip Started!</h1>
      <p class="muted small">All checks completed. You're all set. Drive safe!</p>
    </div></div>
    <div class="screen-pad"><button class="btn btn-primary" onclick="goActiveDriving()">Go to Active Trips</button></div>`;
  }

  if(phase==='ending'){
    return `
    ${AppHeader()}
    <div class="screen-scroll"><div class="screen-pad" style="padding-top:2px;">
      ${TripsTopTabs()}
      <p class="tiny muted" style="text-align:center;margin-bottom:6px;">Trailer</p>
      ${TruckIllustration()}
      ${SosReportContactRow()}

        <div class="row between" style="margin-bottom:12px;">
          <div><p class="tiny muted" style="margin:0;">Trip ID</p><p style="font-weight:800;margin:1px 0 0;font-size:13px;">${S.activeTripId}</p></div>
          <span class="pill green">In Progress</span>
        </div>
        <div class="row gap10" style="align-items:flex-start;margin-bottom:12px;">
          <div style="color:${dropIconColor(leg.to)};margin-top:1px;">${ICONS[leg.to.icon]}</div>
          <div><p style="margin:0;font-weight:600;font-size:13px;">${leg.to.name}</p><p class="tiny muted" style="margin:1px 0 0;">${leg.to.addr}</p></div>
        </div>
        <p class="small" style="margin:0 0 12px;color:var(--accent-dark);font-weight:700;">${ICONS.compass} You have reached your destination</p>

  // inProgress (driving)

  return `

}

function ChecklistScreen(isStart){
  const list = isStart ? (S.startKind==='short' ? SHORT_START_CHECKLIST : START_CHECKLIST) : END_CHECKLIST;
  const step = isStart ? S.startStep : S.endStep;
  const item = list[step];
  const isDeclare = isStart ? !!item.declaration : step === list.length-1;
  const declared = isStart ? S.declareStart : S.declareEnd;
  return `
  ${BackHeader(isStart?'Start Trip Checklists':'End Trip Checklists', isStart?'prevStartStep()':'prevEndStep()')}
  <div class="screen-scroll"><div class="screen-pad">
    <div class="stepper">
      ${list.map((it,i)=>`
        ${i>0?`<div class="step-line ${i<=step?'done':''}"></div>`:''}
        <div class="step-dot ${i<step?'done':''} ${i===step?'now':''}">${i<step?ICONS.check:ICONS[it.icon]}</div>
      `).join('')}
    </div>
    <div class="row between" style="margin-bottom:4px;">
      <p style="font-weight:800;font-size:16px;margin:0;">${item.title}</p>
      <p class="small muted" style="margin:0;">${step+1} / ${list.length}</p>
    </div>
    ${isStart && item.subtitle ? `<p class="small muted" style="margin-top:2px;">${item.subtitle}</p>` : ''}
    ${isDeclare ? `
      <div class="info-banner green" style="margin:14px 0;">${ICONS.shield}

    </div>

}
function ChecklistFields(fields){
  return fields.map(ChecklistField).join('');
}
function ChecklistField(f){
  const val = S.checklistData[f.key];
  if(f.type==='number' || f.type==='text'){
    return `<div class="field"><label>${f.label}</label><input type="${f.type==='number'?'number':'text'}" placeholder="${f.placeholder||''}" value="${val||''}" oninput="S.checklistData['${f.key}']=this.value"></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field"><label>${f.label}</label><textarea rows="3" placeholder="${f.placeholder||''}" oninput="S.checklistData['${f.key}']=this.value">${val||''}</textarea></div>`;
  }
  if(f.type==='toggle'){
    return ToggleRow(f.key, f.icon, f.label, f.options, val);
  }
  if(f.type==='photo'){
    const uploaded = !!S.checklistData[f.key+'Uploaded'];
    return `<div class="field"><label>${f.label}</label>
      <div class="row gap10">
        <div class="card" style="flex:1;text-align:center;padding:26px 8px;border-style:dashed;color:#9CA3AF;cursor:pointer;" onclick="S.checklistData['${f.key}Uploaded']=true;render();">${ICONS.camera}<p class="tiny" style="margin-top:6px;font-weight:700;color:#374151;">Add Photo</p></div>
        ${uploaded ? `<div style="flex:1;border-radius:14px;overflow:hidden;position:relative;">
          <svg viewBox="0 0 140 110" width="100%" style="display:block;"><rect width="140" height="110" fill="#3B4250"/><rect x="20" y="35" width="80" height="45" rx="4" fill="#EDEFF3"/><rect x="30" y="45" width="60" height="6" fill="#B7BFCC"/><rect x="30" y="56" width="40" height="6" fill="#B7BFCC"/></svg>
          <div onclick="event.stopPropagation();S.checklistData['${f.key}Uploaded']=false;render();" style="position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">${ICONS.close}</div>
        </div>` : ''}
      </div>
    </div>`;
  }
  return '';
}
function ToggleRow(fieldKey, icon, label, options, current){
  return `<div class="toggle-row">
    <div class="lbl">${icon?`<div class="list-ic" style="width:30px;height:30px;color:#374151;">${ICONS[icon]}</div>`:''}<p>${label}</p></div>
    <div class="chip-row">${options.map(opt=>`
      <button type="button" class="chip-toggle ${current===opt?'selected':''}" onclick="setChecklistField('${fieldKey}','${opt}')">${opt}</button>
    `).join('')}</div>
  </div>`;
}
function setChecklistField(key, value){
  S.checklistData[key] = value;
  render();
}
function toggleDeclare(isStart){
  if(isStart) S.declareStart = !S.declareStart; else S.declareEnd = !S.declareEnd;
  render();
}
function prevStartStep(){
  if(S.startStep>0){ set({startStep:S.startStep-1}); return; }
  set(S.startKind==='short' ? {tripPhase:'inProgress'} : {tripPhase:'preActive'});
}
function nextStartStep(){
  const list = S.startKind==='short' ? SHORT_START_CHECKLIST : START_CHECKLIST;
  if(S.startStep < list.length-1){ set({startStep:S.startStep+1}); return; }
  if(S.startKind==='short'){
    set({tripPhase:'inProgress', legIndex:S.legIndex+1, startStep:0, declareStart:false});
    showToast('Trip resumed — drive safe!');
  } else {
    set({tripPhase:'startCelebrate'});
  }
}
function prevEndStep(){
  if(S.endStep>0){ set({endStep:S.endStep-1}); return; }
  set(S.endKind==='leg' ? {tripPhase:'inProgress'} : {tripPhase:'ending'});
}
function nextEndStep(){
  if(S.endStep < END_CHECKLIST.length-1){ set({endStep:S.endStep+1}); return; }
  if(S.endKind==='leg'){
    set({tripPhase:'legStartChecklist', startKind:'short', startStep:0, declareStart:false, checklistData:{}});
    showToast('Handover complete — continuing to next leg.');
  } else {
    openModal('endConfirm');
  }
}

      <p class="tiny muted" style="margin:4px 0 0;white-space:nowrap;font-size:10px;">${n.time}</p>
    </div>
    <div style="flex:1;min-width:0;">
      <div class="row between" style="gap:8px;align-items:flex-start;">
        <p style="font-weight:700;margin:0;font-size:13.5px;">${n.t}</p>
        ${n.action ? `<button class="btn btn-dark btn-sm" style="width:auto;flex:0 0 auto;padding:8px 12px;" onclick="closeModal(); showToast('Starting trip to pickup location…')">${n.action}</button>` : ''}

      <p class="small muted" style="margin:4px 0 0;">${n.body}</p>
      ${n.track ? TrackRow(n.track) : ''}

}
function TrackRow(doneCount){
  return `<div class="row" style="margin-top:10px;gap:5px;flex-wrap:wrap;">
    ${TRACK_STEPS.map((label,i)=>`
      ${i>0?`<span style="color:#C4CBD6;display:inline-flex;">${ICONS.chevron}</span>`:''}
      <span class="row gap8" style="gap:5px;"><span style="width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:${i<doneCount?'var(--accent)':'#D8DCE2'};"></span><span class="tiny" style="font-weight:600;color:${i<doneCount?'#374151':'#9CA3AF'};">${label}</span></span>
    `).join('')}
  </div>`;
}

function ModalLogout(){
  return `<div class="overlay center" onclick="if(event.target===this) closeModal()"><div class="sheet pop" style="text-align:center;">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">${ICONS.logout}</div>

/* ---------------- Render ---------------- */
function renderScreenInner(){
  if(S.screen==='mobile') return screenMobile();
  if(S.screen==='otp') return screenOtp();
  if(S.screen==='scanDL') return screenScanDL();
  if(S.screen==='dlVerify') return screenDlVerify();
  if(S.screen==='reviewInfo') return screenReviewInfo();
  if(S.screen==='appSubmitted') return screenAppSubmitted();
  if(S.screen==='home'){
    if(S.tab==='trips'){
      if(S.tripsView==='available') return screenTripsAvailable();
      if(S.tripsView==='upcoming') return screenTripsUpcoming();
      if(S.tripsView==='active') return screenTripsActive();
      if(S.tripsView==='details') return screenTripDetails();
    }
    if(S.tab==='earnings') return screenEarnings();
    if(S.tab==='profile'){
      if(S.profileSub==='personal') return screenProfilePersonal();
      if(S.profileSub==='license') return screenProfileLicense();
      if(S.profileSub==='address') return screenProfileAddress();
      if(S.profileSub==='kyc') return screenProfileKyc();
      if(S.profileSub==='help') return screenProfileHelp();
      if(S.profileSub==='notifSettings') return screenProfileNotifSettings();
      return screenProfileMain();
    }
  }
  return '<p style="padding:24px;">Screen not found</p>';
}

function render(){
  const overlay = S.notificationsOpen ? screenNotifications() : (S.fullPage ? FULL_PAGE_MAP[S.fullPage]() : null);
  document.getElementById('phoneScreen').innerHTML = `
    <div class="phone-notch"></div>
    ${StatusBar()}
    ${overlay !== null ? overlay : renderScreenInner()}
    ${S.toast ? `<div class="toast">${S.toast}</div>` : ''}
    ${overlay !== null ? '' : ModalRoot()}
  `;
  renderPanel();
  renderTopbar();
}

function renderTopbar(){
  const parts = [];
  parts.push(S.certified ? 'Certified driver' : 'Not yet certified');
  const screenLabels = {mobile:'Login · Mobile Number',otp:'Login · OTP',scanDL:'Login · Scan DL',dlVerify:'Login · DL Verification',reviewInfo:'Login · Review Information',appSubmitted:'Login · Application Submitted'};
  if(S.screen!=='home') parts.push(screenLabels[S.screen]||S.screen);
  else {
    parts.push('Tab: ' + S.tab[0].toUpperCase()+S.tab.slice(1));
    if(S.tab==='trips') parts.push('View: ' + S.tripsView[0].toUpperCase()+S.tripsView.slice(1));
    if(S.tab==='profile' && S.profileSub) parts.push(S.profileSub);
  }
  if(S.notificationsOpen) parts.push('Notifications');
  if(S.fullPage) parts.push('Page: '+S.fullPage);
  if(S.modal) parts.push('Modal: '+S.modal);
  document.getElementById('stageTopbar').innerHTML = parts.map((p,i)=>i===0?`<b>${p}</b>`:`<span class="sep">/</span>${p}`).join(' ');
}

function resetAll(){ S = initialState(); render(); }

}

/* Drag the sheet-grabber handle down to dismiss a drawer, like a real bottom sheet. */
(function setupSheetDrag(){
  const DISMISS_PX = 70;
  let dragging = false, startY = 0, sheetEl = null;
  const phoneScreen = document.getElementById('phoneScreen');
  phoneScreen.addEventListener('pointerdown', (e)=>{
    const grabber = e.target.closest('.sheet-grabber');
    if(!grabber) return;
    sheetEl = grabber.closest('.sheet');
    if(!sheetEl) return;
    dragging = true;
    startY = e.clientY;
    sheetEl.style.transition = 'none';
    e.preventDefault();
  });
  window.addEventListener('pointermove', (e)=>{
    if(!dragging || !sheetEl) return;
    const dy = Math.max(0, e.clientY - startY);
    sheetEl.style.transform = `translateY(${dy}px)`;
  });
  window.addEventListener('pointerup', (e)=>{
    if(!dragging || !sheetEl) return;
    dragging = false;
    const dy = Math.max(0, e.clientY - startY);
    const el = sheetEl;
    sheetEl = null;
    el.style.transition = 'transform .18s ease';
    if(dy > DISMISS_PX){
      el.style.transform = `translateY(100%)`;
      setTimeout(()=>{ closeModal(); }, 160);
    } else {
      el.style.transform = '';
    }
  });
})();
